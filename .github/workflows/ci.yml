name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Lint GitHub Actions workflows (actionlint)
        uses: raven-actions/actionlint@v2

  build-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip dependencies
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Audit dependencies for known vulnerabilities (pip-audit)
        run: pip-audit

      - name: Check Formatting (Black)
        run: black --check .

      - name: Run Linting (Flake8)
        run: flake8 .

      - name: Run Static Type Checking (mypy)
        run: mypy --explicit-package-bases . || true  # Using '|| true' temporarily so it doesn't break until typings are fully fixed

      - name: Run Unit Tests (pytest)
        env:
          MIFOS_BASE_URL: https://tt.mifos.community
          MIFOS_TENANT: default
          PYTHONPATH: .
        run: python -m pytest

      - name: Run MCP Smoke Check
        env:
          MIFOS_BASE_URL: https://tt.mifos.community
          MIFOS_TENANT: default
        run: |
          chmod +x local_test.sh
          ./local_test.sh
